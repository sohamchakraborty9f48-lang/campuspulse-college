<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusPulse — Live Campus Hub</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-thumb {
    background: #475569;
    border-radius: 20px;
}
</style>

</head>

<body class="bg-slate-950 text-white h-screen overflow-hidden">

<!-- =========================
     AUTH SCREEN
========================= -->

<div id="authView"
class="fixed inset-0 flex items-center justify-center bg-slate-950 z-50">

<div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-8">

<div class="text-center mb-8">

<h1 class="text-4xl font-black text-indigo-400">
CampusPulse
</h1>

<p class="text-slate-400 mt-2 text-sm">
Your real-time campus community
</p>

</div>


<div id="authError"
class="hidden mb-4 bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-lg text-sm text-center">
</div>


<div class="space-y-4">


<div>
<label class="text-xs uppercase text-slate-400">
Username
</label>

<input id="username"
class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:border-indigo-500"
placeholder="Enter username">
</div>



<div>
<label class="text-xs uppercase text-slate-400">
Password
</label>

<input id="password"
type="password"
class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:border-indigo-500"
placeholder="Password">
</div>



<div>
<label class="text-xs uppercase text-slate-400">
Email
</label>

<input id="email"
type="email"
class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:border-indigo-500"
placeholder="Email for recovery">
</div>



<div class="flex gap-3 pt-3">

<button id="loginBtn"
class="flex-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg py-3 font-bold">
Login
</button>


<button id="signupBtn"
class="flex-1 bg-emerald-600 hover:bg-emerald-500 rounded-lg py-3 font-bold">
Signup
</button>

</div>



<button id="guestBtn"
class="w-full mt-3 bg-slate-800 hover:bg-slate-700 rounded-lg py-3 text-sm">
Continue as Guest
</button>


<button id="forgotBtn"
class="w-full text-indigo-400 text-sm mt-4 hover:underline">
Forgot Password?
</button>



<div id="forgotBox"
class="hidden mt-4 border-t border-slate-700 pt-4 space-y-3">


<input id="forgotEmail"
type="email"
class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2"
placeholder="Registered email">


<button id="resetBtn"
class="w-full bg-slate-700 hover:bg-slate-600 rounded-lg py-2">
Send Reset Mail
</button>


<p id="resetStatus"
class="text-xs text-center text-slate-400"></p>


</div>


</div>

</div>

</div>




<!-- =========================
     MAIN APP
========================= -->


<div id="appView"
class="hidden h-screen flex">


<!-- SIDEBAR -->

<aside
class="hidden md:flex w-72 bg-slate-900 border-r border-slate-800 flex-col">


<div class="p-5 border-b border-slate-800">

<h2 class="text-xl font-bold text-indigo-400">
CampusPulse
</h2>


<div id="myName"
class="mt-3 text-xs bg-indigo-500/20 text-indigo-300 px-3 py-2 rounded-full">
</div>


</div>



<div class="flex-1 overflow-y-auto p-4">


<h3 class="text-xs uppercase text-slate-500 mb-3">
Online Students
</h3>


<ul id="usersList"
class="space-y-2">
</ul>



<div class="mt-8 bg-slate-950 border border-slate-800 rounded-xl p-4">


<h3 class="text-sm font-bold text-indigo-300 mb-3">
Campus Poll
</h3>


<div id="pollQuestion"
class="text-xs text-slate-300 mb-3">
Loading...
</div>


<div id="pollOptions"
class="space-y-2">
</div>


</div>


</div>



<div class="p-4 border-t border-slate-800">


<button id="logoutBtn"
class="w-full bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white py-3 rounded-lg font-bold">
Logout
</button>


</div>


</aside>





<!-- MOBILE/TOP + CHAT AREA -->

<main
class="flex-1 flex flex-col bg-slate-950">


<header
class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-5">


<div>

<h1 class="font-bold text-lg">
Live Campus Stream
</h1>

<p class="text-xs text-slate-500">
Public chat
</p>

</div>



<button id="mobileWhisperBtn"
class="md:hidden bg-purple-600 px-3 py-2 rounded-lg text-sm">
🤫 Whisper
</button>


</header>
<!-- =========================
     CHAT AREA
========================= -->


<section
id="chatBox"
class="flex-1 flex flex-col">


<!-- Messages -->

<div id="messages"
class="flex-1 overflow-y-auto p-5 space-y-4">


</div>





<!-- Typing Indicator -->

<div id="typingBox"
class="hidden px-5 py-2 text-xs text-slate-400 italic">

Someone is typing...

</div>





<!-- Message Composer -->

<div
class="bg-slate-900 border-t border-slate-800 p-4">


<div class="flex gap-3 items-center">



<input
id="messageInput"
class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-indigo-500"
placeholder="Write something to campus...">





<input
id="mediaInput"
type="file"
accept="image/*,video/*"
class="hidden">



<button
id="uploadBtn"
class="bg-slate-800 hover:bg-slate-700 px-4 py-3 rounded-xl">

📎

</button>




<button
id="sendBtn"
class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-bold">

Send

</button>


</div>



</div>


</section>



</main>


</div>






<!-- =========================
     WHISPER MODAL
========================= -->


<div
id="whisperModal"
class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-5">


<div
class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-6">


<h2 class="text-xl font-bold text-purple-400 mb-4">
Anonymous Whisper 🤫
</h2>



<textarea
id="whisperInput"
rows="4"
class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 outline-none resize-none"
placeholder="Say something anonymously..."></textarea>




<div class="flex justify-end gap-3 mt-4">


<button
id="closeWhisper"
class="px-5 py-2 rounded-lg bg-slate-700">

Cancel

</button>



<button
id="sendWhisper"
class="px-5 py-2 rounded-lg bg-purple-600 hover:bg-purple-500">

Post

</button>


</div>


</div>


</div>






<!-- =========================
     MEDIA PREVIEW MODAL
========================= -->


<div
id="mediaModal"
class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-5">


<div
class="bg-slate-900 border border-slate-700 rounded-xl p-6 w-full max-w-md">


<h3 class="font-bold mb-4">
Upload Media
</h3>


<div id="uploadStatus"
class="text-sm text-slate-400 mb-4">
</div>



<button
id="confirmUpload"
class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-bold">

Upload

</button>


</div>


</div>






<script>


// =========================
// VARIABLES
// =========================


let socket;

let currentUser=null;

let selectedFile=null;

let reconnectTimer=null;





const $ = id =>
document.getElementById(id);





const authView=$("authView");

const appView=$("appView");

const authError=$("authError");


const username=$("username");

const password=$("password");

const email=$("email");



const loginBtn=$("loginBtn");

const signupBtn=$("signupBtn");

const guestBtn=$("guestBtn");



const messages=$("messages");

const messageInput=$("messageInput");

const sendBtn=$("sendBtn");

const usersList=$("usersList");



const whisperModal=$("whisperModal");

const whisperInput=$("whisperInput");



const mediaInput=$("mediaInput");






// =========================
// WEBSOCKET CONNECT
// =========================


function connect(){


const protocol =
location.protocol==="https:"
? "wss:"
: "ws:";


socket =
new WebSocket(
`${protocol}//${location.host}`
);



socket.onopen=()=>{

console.log(
"CampusPulse connected"
);

};





socket.onclose=()=>{


console.log(
"Disconnected"
);



reconnectTimer=setTimeout(
connect,
3000
);


};





socket.onerror=()=>{

console.log(
"socket error"
);

};




}





connect();






// =========================
// AUTH UI
// =========================



loginBtn.onclick=()=>{


send({

type:"login",

name:username.value,

password:password.value

});


};





signupBtn.onclick=()=>{


send({

type:"signup",

name:username.value,

password:password.value,

email:email.value

});


};





guestBtn.onclick=()=>{


send({

type:"login",

name:
"Guest-"+Math.random()
.toString(36)
.substring(2,7)

});


};





function send(data){


if(
socket &&
socket.readyState===1
){

socket.send(
JSON.stringify(data)
);

}


}






// =========================
// FORGOT PASSWORD
// =========================


$("forgotBtn").onclick=()=>{


$("forgotBox")
.classList
.toggle("hidden");


};



$("resetBtn").onclick=
async()=>{


const res=
await fetch(
"/api/forgot-password",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

email:
$("forgotEmail").value

})


});



const data=
await res.json();



$("resetStatus")
.innerText=
data.message ||
data.error;


};
// =========================
// WEBSOCKET EVENTS
// =========================


socket.onmessage=(event)=>{


let data;


try{

data=JSON.parse(event.data);

}

catch{

return;

}





// LOGIN SUCCESS

if(data.type==="me"){


currentUser=data.me;


$("myName").innerText=
data.me.name;


authView.classList.add(
"hidden"
);


appView.classList.remove(
"hidden"
);


}







// ERROR

if(data.type==="auth_error"){


authError.innerText=
data.message;


authError.classList.remove(
"hidden"
);


}






// USERS


if(data.type==="users"){


renderUsers(
data.users
);


}






// INITIAL STATE


if(data.type==="state"){


renderUsers(
data.users
);



messages.innerHTML="";



(data.messages||[])
.forEach(
m=>renderMessage(m)
);



(data.whispers||[])
.forEach(
w=>renderWhisper(w)
);



if(data.poll)

renderPoll(
data.poll
);


}






// NEW MESSAGE


if(data.type==="chat"){


renderMessage(
data.message
);


}






// WHISPER


if(data.type==="whisper"){


renderWhisper(
data.whisper
);


}





// POLL


if(data.type==="poll"){


renderPoll(
data.poll
);


}



};









// =========================
// SEND MESSAGE
// =========================



sendBtn.onclick=
sendMessage;



messageInput.onkeydown=e=>{


if(e.key==="Enter")

sendMessage();


};



function sendMessage(){


let text=
messageInput.value.trim();


if(!text)

return;



send({

type:"chat",

text

});



messageInput.value="";


}









// =========================
// RENDER MESSAGE
// =========================


function renderMessage(msg){



let div=
document.createElement(
"div"
);



let mine=
currentUser &&
msg.from===currentUser.id;



div.className=
`
flex
${mine?"justify-end":"justify-start"}
`;



div.innerHTML=`

<div class="
max-w-[75%]
rounded-2xl
p-3
${mine?
"bg-indigo-600":
"bg-slate-800 border border-slate-700"}
">


<div class="text-xs opacity-60 mb-1">

${escapeHTML(msg.name)}
•
${msg.time||""}

</div>


<div>

${escapeHTML(msg.text)}

</div>


${msg.mediaUrl?
`

<img
src="${msg.mediaUrl}"
class="mt-2 rounded-xl max-h-64">

`
:""}


</div>

`;



messages.appendChild(div);



messages.scrollTop=
messages.scrollHeight;


}









// =========================
// USERS
// =========================


function renderUsers(users){


usersList.innerHTML="";



users.forEach(
u=>{


let li=
document.createElement(
"li"
);



li.className=
`
bg-slate-950
border
border-slate-800
rounded-lg
px-3
py-2
text-sm
flex
justify-between
`;



li.innerHTML=

`

<span>
${escapeHTML(u.name)}
</span>


<span class="
text-xs
text-indigo-400">
${u.role}
</span>

`;



usersList.appendChild(li);


});


}









// =========================
// WHISPERS
// =========================



function renderWhisper(w){


let div=
document.createElement(
"div"
);



div.className=
`
bg-purple-950/40
border
border-purple-700/40
rounded-xl
p-4
text-purple-200
mx-auto
max-w-xl
`;



div.innerHTML=

`

<b>
🤫 Anonymous
</b>

<p class="mt-2">
${escapeHTML(w.text)}
</p>

`;



messages.appendChild(div);


}









// =========================
// POLL
// =========================



function renderPoll(p){


$("pollQuestion")
.innerText=
p.question;



$("pollOptions")
.innerHTML="";



p.options.forEach(
(opt,i)=>{


let btn=
document.createElement(
"button"
);



btn.className=
`
w-full
text-left
bg-slate-800
hover:bg-slate-700
rounded-lg
p-2
text-xs
`;



let total=
p.votes.reduce(
(a,b)=>a+b,
0
);



let percent=
total?
Math.round(
p.votes[i]/total*100
)
:0;



btn.innerText=
`${opt} - ${percent}%`;



btn.onclick=()=>{


send({

type:"vote",

index:i

});


};



$("pollOptions")
.appendChild(btn);


});


}









// =========================
// WHISPER
// =========================


$("mobileWhisperBtn").onclick=
()=>{

whisperModal
.classList
.remove(
"hidden"
);

};



$("closeWhisper").onclick=
()=>{


whisperModal
.classList
.add(
"hidden"
);


};





$("sendWhisper").onclick=
()=>{


let text=
whisperInput.value.trim();



if(!text)

return;



send({

type:"whisper",

text

});



whisperInput.value="";


whisperModal
.classList
.add(
"hidden"
);


};









// =========================
// UPLOAD
// =========================


$("uploadBtn").onclick=
()=>{


mediaInput.click();


};




mediaInput.onchange=e=>{


selectedFile=
e.target.files[0];



if(selectedFile){


$("mediaModal")
.classList
.remove(
"hidden"
);


}


};





$("confirmUpload").onclick=
async()=>{


if(!selectedFile)

return;



$("uploadStatus")
.innerText=
"Uploading...";



let form=
new FormData();



form.append(
"media",
selectedFile
);



try{


let res=
await fetch(
"/api/upload",
{

method:"POST",

body:form

});



let data=
await res.json();



send({

type:"chat",

text:"",

mediaUrl:data.fileUrl,

mediaType:data.fileType

});



$("uploadStatus")
.innerText=
"Uploaded";


$("mediaModal")
.classList
.add(
"hidden"
);



}

catch{


$("uploadStatus")
.innerText=
"Upload failed";


}


};









// =========================
// LOGOUT
// =========================



$("logoutBtn").onclick=
()=>{


send({

type:"logout"

});



if(socket)

socket.close();



location.reload();


};









// =========================
// SECURITY
// =========================


function escapeHTML(str){


if(!str)

return "";



return str
.toString()
.replace(
/[&<>"']/g,
c=>
({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c])
);


}


</script>

</body>
</html>
