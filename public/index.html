<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusPulse — Live Campus Hub</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-slate-950 text-white h-screen overflow-hidden">


<!-- ================= AUTH ================= -->

<div id="authView"
class="fixed inset-0 flex items-center justify-center bg-slate-950 z-50">


<div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">


<h1 class="text-4xl font-bold text-center text-indigo-400">
CampusPulse
</h1>


<p class="text-center text-slate-400 mt-2 mb-6">
Live Campus Social Network
</p>



<div id="authError"
class="hidden bg-red-500/10 text-red-400 p-3 rounded-lg mb-4 text-sm">
</div>



<label class="text-xs text-slate-400">
USERNAME
</label>

<input id="loginName"
class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 mb-4"
placeholder="username">



<label class="text-xs text-slate-400">
PASSWORD
</label>

<input id="loginPassword"
type="password"
class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 mb-4"
placeholder="password (blank = guest)">



<label class="text-xs text-slate-400">
EMAIL (SIGNUP)
</label>

<input id="signupEmail"
type="email"
class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 mb-5"
placeholder="email@example.com">



<div class="flex gap-3">


<button id="loginBtn"
class="flex-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg py-3">
Login
</button>


<button id="signupBtn"
class="flex-1 bg-emerald-600 hover:bg-emerald-500 rounded-lg py-3">
Signup
</button>


</div>




<button id="guestBtn"
class="w-full mt-3 bg-slate-800 hover:bg-slate-700 rounded-lg py-3">
Continue as Guest
</button>




<button id="forgotBtn"
class="block mx-auto mt-5 text-indigo-400 text-sm">
Forgot Password?
</button>





<div id="forgotBox"
class="hidden mt-5 border-t border-slate-800 pt-5">


<input id="forgotEmail"
type="email"
class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3"
placeholder="registered email">


<button id="sendResetBtn"
class="w-full mt-3 bg-slate-700 rounded-lg py-3">
Send Recovery Mail
</button>


<p id="forgotStatus"
class="text-xs text-center text-slate-400 mt-2">
</p>


</div>



</div>


</div>





<!-- ================= APP ================= -->


<div id="appView"
class="hidden h-screen flex">



<!-- SIDEBAR -->


<aside class="w-72 bg-slate-900 border-r border-slate-800 p-5 flex flex-col">


<h2 class="text-2xl font-bold text-indigo-400">
CampusPulse
</h2>



<div class="mt-3 text-sm bg-slate-800 rounded-lg p-3">

<span id="myName">
</span>

</div>





<h3 class="mt-8 text-xs uppercase text-slate-400">
Online Users
</h3>


<ul id="usersList"
class="mt-3 space-y-2">
</ul>




<div class="mt-8 bg-slate-950 rounded-xl p-4">


<h3 id="pollQuestion"
class="text-sm font-bold text-indigo-300">
Poll
</h3>


<div id="pollOptions"
class="mt-3 space-y-2">
</div>


</div>





<button id="logoutBtn"
class="mt-auto bg-red-600 hover:bg-red-500 rounded-lg py-3">
Logout
</button>



</aside>





<!-- CHAT -->


<main class="flex-1 flex flex-col">



<header
class="bg-slate-900 border-b border-slate-800 p-5 flex justify-between">


<div>

<h1 class="font-bold text-xl">
Live Campus Stream
</h1>


<p class="text-xs text-slate-400">
Public chat & anonymous whispers
</p>

</div>



<button id="mobileWhisperBtn"
class="bg-purple-700 px-4 py-2 rounded-lg">

🤫 Whisper

</button>


</header>





<div id="messages"
class="flex-1 overflow-y-auto p-5 space-y-3">

</div>





<div class="p-4 bg-slate-900 border-t border-slate-800 flex gap-3">


<input id="messageInput"
class="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-3"
placeholder="Message campus...">


<button id="sendBtn"
class="bg-indigo-600 px-6 rounded-lg">

Send

</button>


</div>



</main>
    <script>

let socket = null;

let currentUser = null;

let selectedFile = null;



const $ = id => document.getElementById(id);




const authView = $("authView");
const appView = $("appView");

const authError = $("authError");

const messages = $("messages");

const usersList = $("usersList");

const messageInput = $("messageInput");

const sendBtn = $("sendBtn");





// =========================
// CONNECT WEBSOCKET
// =========================


function connect(){


const protocol =
location.protocol === "https:"
? "wss:"
: "ws:";


socket =
new WebSocket(
`${protocol}//${location.host}`
);



socket.onopen = ()=>{

console.log(
"CampusPulse Connected"
);

};





socket.onclose = ()=>{

console.log(
"Disconnected"
);


setTimeout(
connect,
3000
);

};





socket.onmessage=(event)=>{


let data;


try{

data =
JSON.parse(event.data);

}

catch{

return;

}





// LOGIN SUCCESS

if(data.type==="me"){


currentUser =
data.me;


$("myName").innerText =
data.me.name;


authView.classList.add(
"hidden"
);


appView.classList.remove(
"hidden"
);


}






// ERROR


if(data.type==="auth_error"){


authError.innerText =
data.message;


authError.classList.remove(
"hidden"
);


}






// USERS


if(data.type==="users"){


renderUsers(
data.users
);


}





// STATE


if(data.type==="state"){


renderUsers(
data.users
);



messages.innerHTML="";



(data.messages || [])
.forEach(
m=>renderMessage(m)
);



(data.whispers || [])
.forEach(
w=>renderWhisper(w)
);



if(data.poll)

renderPoll(
data.poll
);



}





// CHAT


if(data.type==="chat"){


renderMessage(
data.message
);


}






// WHISPER


if(data.type==="whisper"){


renderWhisper(
data.whisper
);


}







// POLL


if(data.type==="poll"){


renderPoll(
data.poll
);


}


};


}





connect();






// =========================
// SEND DATA
// =========================


function send(data){


if(
socket &&
socket.readyState === WebSocket.OPEN
){

socket.send(
JSON.stringify(data)
);

}


}







// =========================
// LOGIN
// =========================



$("loginBtn").onclick=()=>{


authError.classList.add(
"hidden"
);



send({

type:"login",

name:$("loginName").value.trim(),

password:$("loginPassword").value.trim()

});


};









// =========================
// SIGNUP
// =========================



$("signupBtn").onclick=()=>{


let name =
$("loginName").value.trim();


let password =
$("loginPassword").value.trim();


let email =
$("signupEmail").value.trim();




if(!name || !password || !email){


authError.innerText =
"Name password and email required";


authError.classList.remove(
"hidden"
);


return;

}





send({

type:"signup",

name,

password,

email

});


};







// =========================
// GUEST
// =========================



$("guestBtn").onclick=()=>{


send({

type:"login",

name:
"Guest"

});


};







// =========================
// CHAT SEND
// =========================



sendBtn.onclick =
sendMessage;



messageInput.onkeydown =
e=>{


if(e.key==="Enter")

sendMessage();


};




function sendMessage(){


let text =
messageInput.value.trim();


if(!text)

return;




send({

type:"chat",

text

});



messageInput.value="";


}







// =========================
// RENDER MESSAGE
// =========================


function renderMessage(msg){



let div =
document.createElement(
"div"
);



let mine =
currentUser &&
msg.from===currentUser.id;



div.className =
`
flex
${mine?
"justify-end":
"justify-start"}
`;





div.innerHTML = `


<div class="
max-w-[70%]
rounded-xl
p-3

${mine?
"bg-indigo-600":
"bg-slate-800 border border-slate-700"}

">


<div class="
text-xs
opacity-60
">

${escapeHTML(msg.name)}
•
${msg.time || ""}

</div>



<p class="mt-1">

${escapeHTML(msg.text)}

</p>



${msg.mediaUrl ?

`

<img
src="${msg.mediaUrl}"
class="rounded-lg mt-2 max-h-64">

`

:""}



</div>


`;




messages.appendChild(div);


messages.scrollTop =
messages.scrollHeight;


}








// =========================
// USERS
// =========================


function renderUsers(users){


usersList.innerHTML="";



users.forEach(
u=>{


let li =
document.createElement(
"li"
);



li.className =
`
bg-slate-950
border
border-slate-800
rounded-lg
p-2
flex
justify-between
text-sm
`;



li.innerHTML = `

<span>
${escapeHTML(u.name)}
</span>


<span class="text-indigo-400 text-xs">
${u.role}
</span>

`;



usersList.appendChild(li);


});


}
        // =========================
// WHISPERS
// =========================


$("mobileWhisperBtn").onclick=()=>{


let text =
prompt(
"Write anonymous whisper"
);


if(text && text.trim()){


send({

type:"whisper",

text:text.trim()

});


}


};







function renderWhisper(w){



let div =
document.createElement(
"div"
);



div.className =
`
bg-purple-950/40
border
border-purple-700
rounded-xl
p-4
max-w-xl
mx-auto
`;



div.innerHTML = `


<b class="text-purple-300">

🤫 Anonymous Whisper

</b>


<p class="mt-2">

${escapeHTML(w.text)}

</p>


`;



messages.appendChild(div);


messages.scrollTop =
messages.scrollHeight;


}








// =========================
// POLL
// =========================



function renderPoll(p){


$("pollQuestion").innerText =
p.question;


$("pollOptions").innerHTML="";



let total =
p.votes.reduce(
(a,b)=>a+b,
0
);




p.options.forEach(
(opt,i)=>{


let percent =
total ?
Math.round(
p.votes[i]/total*100
)
:
0;




let btn =
document.createElement(
"button"
);



btn.className =
`
w-full
text-left
bg-slate-800
hover:bg-slate-700
rounded-lg
p-2
text-xs
`;



btn.innerText =
`${opt}  ${percent}%`;



btn.onclick=()=>{


send({

type:"vote",

index:i

});


};



$("pollOptions")
.appendChild(btn);



});


}







// =========================
// FORGOT PASSWORD
// =========================



$("forgotBtn").onclick=()=>{


$("forgotBox")
.classList
.toggle(
"hidden"
);


};






$("sendResetBtn").onclick=
async()=>{


let email =
$("forgotEmail")
.value
.trim();



if(!email){

$("forgotStatus")
.innerText =
"Enter email";

return;

}



$("forgotStatus")
.innerText =
"Sending...";



try{


let res =
await fetch(
"/api/forgot-password",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
email
})

}

);



let data =
await res.json();



$("forgotStatus")
.innerText =
res.ok
?
"✅ Mail sent"
:
data.error;



}

catch{


$("forgotStatus")
.innerText =
"Server error";


}



};








// =========================
// MEDIA UPLOAD SUPPORT
// =========================



let uploadInput =
document.createElement(
"input"
);


uploadInput.type =
"file";


uploadInput.accept =
"image/*,video/*";


uploadInput.className =
"hidden";


document.body.appendChild(
uploadInput
);





let uploadButton =
document.createElement(
"button"
);



uploadButton.innerText =
"📎";


uploadButton.className =
`
bg-slate-700
px-4
rounded-lg
`;



$("sendBtn")
.parentElement
.insertBefore(
uploadButton,
$("sendBtn")
);




uploadButton.onclick=()=>{

uploadInput.click();

};





uploadInput.onchange =
async()=>{


let file =
uploadInput.files[0];



if(!file)

return;



let form =
new FormData();


form.append(
"media",
file
);



try{


let res =
await fetch(
"/api/upload",
{

method:"POST",

body:form

}

);



let data =
await res.json();



send({

type:"chat",

text:"",

mediaUrl:
data.fileUrl,

mediaType:
data.fileType

});



}

catch(e){

console.log(
"Upload failed",
e
);

}


};








// =========================
// LOGOUT
// =========================


$("logoutBtn").onclick=()=>{


if(socket)

socket.close();



location.reload();


};








// =========================
// SECURITY
// =========================



function escapeHTML(str){


if(!str)

return "";



return str
.toString()
.replace(
/[&<>"']/g,

c=>

({

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#039;"

}[c])

);


}



</script>


</body>

</html>




</div>
